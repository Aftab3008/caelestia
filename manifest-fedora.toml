# Caelestia Fedora Manifest
# Package names converted from Arch Linux to Fedora equivalents.
# COPR repos listed under each component's `copr` field; the install
# script enables them before installing packages.

# COPR repo definitions — each maps to one or more packages.
# Format: repo_owner/repo_name = [packages...]
[copr]
# solopasha/hyprland: provides uwsm + cliphist on ALL Fedora versions.
#   On Fedora 44+, the Hyprland package itself is outdated (0.51) in this COPR,
#   so the install script uses ashbuk/Hyprland-Fedora for the Hyprland binary.
#   Both COPRs are enabled simultaneously on Fedora 44+ (each provides different packages).
# ashbuk/Hyprland-Fedora: provides up-to-date Hyprland (0.55.1+) for Fedora 43+.
#   Auto-selected by the install script when VERSION_ID >= 44.
"solopasha/hyprland" = ["uwsm", "cliphist"]
"errornointernet/quickshell" = ["quickshell"]
"atim/lazygit" = ["lazygit"]
"maveonair/jetbrains-mono-nerd-fonts" = ["jetbrains-mono-nerd-fonts"]
"aquacash5/nerd-fonts" = ["caskaydia-cove-nerd-fonts"]
"purian23/material-symbols-fonts" = ["material-symbols-fonts"]
"zawertun/scrapyard" = ["libcava"]  # May lag behind on F44; installer falls back to source build
"celestelove/app2unit" = ["app2unit"]
"brycensranch/gpu-screen-recorder-git" = ["gpu-screen-recorder"]

# Global packages — CLI and shell are installed manually via the install script.
packages = []
post_install = [
    "test -f ${XDG_STATE_HOME:-$HOME/.local/state}/caelestia/scheme.json || caelestia scheme set -n caelestia",
    "caelestia shell -d >/dev/null",
]
post_update = ["caelestia shell -k; sleep 1; caelestia shell -d >/dev/null"]

# --- Core components ---

[[components]]
name = "hypr"
default = true
packages = [
    "hyprland",
    "xdg-desktop-portal-hyprland",
    "xdg-desktop-portal-gtk",
]
copr = ["maveonair/jetbrains-mono-nerd-fonts"]
copr_packages = ["jetbrains-mono-nerd-fonts"]
post_install = ["hyprctl reload >/dev/null"]
post_update = ["hyprctl reload >/dev/null"]
[[components.entries]]
src = "hypr"
dest = "$XDG_CONFIG_HOME/hypr"

[[components]]
name = "fish"
default = true
packages = ["fish", "eza", "zoxide", "direnv"]
post_install = [
    "mkdir -p ${XDG_CONFIG_HOME:-$HOME/.config}/caelestia",
    "touch ${XDG_CONFIG_HOME:-$HOME/.config}/caelestia/user-config.fish",
]
[[components.entries]]
src = "fish"
dest = "$XDG_CONFIG_HOME/fish"

[[components]]
name = "foot"
default = true
packages = ["foot", "fish"]
copr = ["maveonair/jetbrains-mono-nerd-fonts"]
copr_packages = ["jetbrains-mono-nerd-fonts"]
[[components.entries]]
src = "foot"
dest = "$XDG_CONFIG_HOME/foot"

[[components]]
name = "fastfetch"
default = true
packages = ["fastfetch"]
[[components.entries]]
src = "fastfetch"
dest = "$XDG_CONFIG_HOME/fastfetch"

[[components]]
name = "btop"
default = true
packages = ["btop"]
post_install = ["killall -USR2 btop 2>/dev/null || true"]
post_update = ["killall -USR2 btop 2>/dev/null || true"]
[[components.entries]]
src = "btop"
dest = "$XDG_CONFIG_HOME/btop"

[[components]]
name = "micro"
default = true
packages = ["micro"]
[[components.entries]]
src = "micro"
dest = "$XDG_CONFIG_HOME/micro"

[[components]]
name = "thunar"
default = true
packages = ["thunar"]
[[components.entries]]
src = "thunar"
dest = "$XDG_CONFIG_HOME/Thunar"

[[components]]
name = "starship"
default = true
packages = ["starship"]
[[components.entries]]
src = "starship.toml"
dest = "$XDG_CONFIG_HOME/starship.toml"

[[components]]
name = "firefox"
default = true
packages = ["firefox"]
post_package = ["bash $CAELESTIA_DOTS/firefox/init_firefox.sh"]
post_install = [
    # Install the native messaging host manually (no RPM available yet).
    # The caelestia-firefox-theme PKGBUILD installs these two files; we replicate that here.
    "sudo install -Dm644 $CAELESTIA_DOTS/firefox/native_app/manifest.json /usr/lib/mozilla/native-messaging-hosts/caelestiafox.json",
    "sudo install -Dm755 $CAELESTIA_DOTS/firefox/native_app/app.fish /usr/lib/caelestia/caelestiafox",
]
[[components.entries]]
src = "firefox/userChrome.css"
dest = "$HOME/.mozilla/firefox/*.default*/chrome/userChrome.css"
[[components.entries]]
src = "firefox/user.js"
dest = "$HOME/.mozilla/firefox/*.default*/user.js"

[[components]]
name = "gtk"
default = true
packages = ["adw-gtk3-theme", "papirus-icon-theme"]
# papirus-folders is not packaged on Fedora.
# The install script will install it from GitHub.

[[components]]
name = "qt"
default = true
packages = [
    "qt5ct",
    "qt6ct",
    "qt5-qtstyleplugins",
    "kf6-frameworkintegration",
    "papirus-icon-theme",
]
# darkly-bin is not packaged on Fedora. The install script builds it from source.
# qtengine does not exist on Fedora; replaced by qt5ct + qt6ct + qt5-qtstyleplugins + kf6-frameworkintegration.

[[components]]
name = "auth"
default = true
packages = ["gnome-keyring", "polkit-gnome"]

[[components]]
name = "network"
default = true
packages = ["NetworkManager"]

[[components]]
name = "bluetooth"
default = true
packages = ["bluez", "bluez-utils"]

[[components]]
name = "pipewire"
default = true
packages = [
    "pipewire",
    "pipewire-pulseaudio",
    "pipewire-alsa",
    "pipewire-jack-audio-connection-kit",
    "wireplumber",
    "pavucontrol",
]
# pipewire-audio (Arch metapackage) does not exist on Fedora.
# pipewire + pipewire-pulseaudio covers the same functionality.

[[components]]
name = "clipboard"
default = true
packages = ["wl-clipboard"]
copr = ["solopasha/hyprland"]
copr_packages = ["cliphist"]

[[components]]
name = "fonts"
default = true
packages = [
    "google-noto-sans-fonts",
    "google-noto-sans-cjk-fonts",
    "google-noto-emoji-fonts",
]

[[components]]
name = "tools"
default = true
packages = [
    "curl",
    "git",
    "trash-cli",
    "jq",
    "bat",
    "ripgrep",
    "ydotool",
    "hyprpicker",
    "xdg-user-dirs",
]
copr = ["atim/lazygit"]
copr_packages = ["lazygit"]
post_install = ["xdg-user-dirs-update"]


# --- Optional components ---

[[components]]
name = "spotify"
default = false
packages = []
# Spotify: available via flatpak or RPM Fusion's lpf-spotify-client.
# spicetify-cli: installed via upstream shell script.
# spicetify-marketplace-bin: installed via GitHub release.
post_install = [
    "spicetify config current_theme caelestia color_scheme caelestia custom_apps marketplace",
    "spicetify apply",
]
[[components.entries]]
src = "spicetify"
dest = "$XDG_CONFIG_HOME/spicetify"

[[components]]
name = "vscodium"
default = false
packages = []
# VSCodium: install from official VSCodium RPM repo or dl3yc/vscodium COPR.
# The install script handles adding the repo and installing codium.
post_install = [
    "codium --install-extension $CAELESTIA_DOTS/vscode/caelestia-vscode-integration/caelestia-vscode-integration-*.vsix",
]
[[components.entries]]
src = "vscode/settings.json"
dest = "$XDG_CONFIG_HOME/VSCodium/User/settings.json"
[[components.entries]]
src = "vscode/keybindings.json"
dest = "$XDG_CONFIG_HOME/VSCodium/User/keybindings.json"
[[components.entries]]
src = "vscode/flags.conf"
dest = "$XDG_CONFIG_HOME/codium-flags.conf"

[[components]]
name = "vscode"
default = false
packages = ["code"]
# code is available from Microsoft's RPM repo.
# The install script handles importing the Microsoft GPG key and adding the repo.
post_install = [
    "code --install-extension $CAELESTIA_DOTS/vscode/caelestia-vscode-integration/caelestia-vscode-integration-*.vsix",
]
[[components.entries]]
src = "vscode/settings.json"
dest = "$XDG_CONFIG_HOME/Code/User/settings.json"
[[components.entries]]
src = "vscode/keybindings.json"
dest = "$XDG_CONFIG_HOME/Code/User/keybindings.json"
[[components.entries]]
src = "vscode/flags.conf"
dest = "$XDG_CONFIG_HOME/code-flags.conf"

[[components]]
name = "zed"
default = false
packages = []
# zed is available via pgdev/zed COPR.
# The install script handles enabling the COPR and installing zed.
[[components.entries]]
src = "zed"
dest = "$XDG_CONFIG_HOME/zed"

[[components]]
name = "discord"
default = false
packages = []
# equibop-bin is not available on Fedora.
# Users can download the AppImage from GitHub or use vesktop (recommended).

[[components]]
name = "todoist"
default = false
packages = []
# todoist-appimage is not packaged on Fedora.
# Users can download the AppImage directly from https://todoist.com/downloads/linux.

[[components]]
name = "uwsm"
default = false
copr = ["solopasha/hyprland"]
copr_packages = ["uwsm"]
packages = []
[[components.entries]]
src = "uwsm"
dest = "$XDG_CONFIG_HOME/uwsm"

[[components]]
name = "zen"
default = false
packages = []
# zen-browser is available via COPR (scottames/zen-browser, sneexy/zen-browser, or architektapx/zen-browser).
# The install script handles enabling the COPR and installing zen-browser.
